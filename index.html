.hero{display:flex;align-items:center;gap:14px;margin-bottom:4px}.orb{width:84px;height:84px;flex:none;cursor:pointer}.orb circle{fill:none;stroke:var(--a);stroke-width:1.5}.o1{stroke-dasharray:6 8;transform-origin:50px 50px;animation:sp 18s linear infinite}.o2{stroke:var(--v)!important;stroke-dasharray:30 12;transform-origin:50px 50px;animation:sp 10s linear infinite reverse}.oc{fill:var(--a)!important;stroke:none!important;transform-origin:50px 50px;animation:pl 2.4s ease-in-out infinite;filter:drop-shadow(0 0 6px var(--a))}.o3{transform-origin:50px 50px;animation:sp 6s linear infinite}.o3 circle{fill:var(--v);stroke:none}

<dialog id="fd"></dialog><dialog id="mo"></dialog><dialog id="cf"><form method="dialog"><p id="cm"></p><div class="ac"><button value="n">Cancel</button><button value="y" class="pr">Confirm</button></div></form></dialog><div id="ts" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1+'').padStart(2,0)+'-'+(d.getDate()+'').padStart(2,0)};
const KEY='nexus.v1',D=()=>({v:1,demo:false,seeded:0,set:{theme:'dark',acc:'#3d6df5',rm:false,f:25,b:5,name:'',col:false,auto:false,lastBk:0},tasks:[],goals:[],tools:[],prompts:[],projects:[],skills:[],games:[],notes:[],plan:[],log:[],timer:{mode:'focus',end:0,left:1500000}});
let S;try{S={...D(),...JSON.parse(localStorage.getItem(KEY)||'{}')};S.set={...D().set,...S.set};S.timer={...D().timer,...S.timer}}catch{S=D()}
const save=q=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{toast('Storage is unavailable. Changes last only until you close this tab.')}if(!q&&S.set.auto){clearTimeout(save.h);save.h=setTimeout(()=>cloudUp(1),4000)}};
let CL=null;async function cloud(){if(CL)return CL;try{if(!window.claude)return null;const[db,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!u)return null;const id=await u.id();if(!id)return null;CL=db.doc('data/users/'+id+'/backup');return CL}catch{return null}}
async function cloudUp(q){const r=await cloud();if(!r)return q||toast('Cloud backup is unavailable here. Open the published page while signed in to Claude.');const j=JSON.stringify(S);if(j.length>240000)return toast('Too much data for one cloud backup (limit about 240 KB).');try{await r.set({json:j,at:Date.now()});S.set.lastBk=Date.now();save(1);if(!q)render();toast('Backed up to the cloud')}catch(e){toast('Cloud backup failed: '+(e.message||e.code||'unknown error'))}}
async function cloudDown(){const r=await cloud();if(!r)return toast('Cloud restore is unavailable here. Open the published page while signed in to Claude.');try{const s=await r.get();if(!s.exists)return toast('No cloud backup found yet.');$('#io').value=s.data().json;imp()}catch(e){toast('Cloud restore failed: '+(e.message||e.code||'unknown error'))}}
const toast=m=>{const t=$('#ts');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2400)};
const ask=m=>new Promise(r=>{$('#cm').textContent=m;const d=$('#cf');d.returnValue='n';d.onclose=()=>r(d.returnValue=='y');d.showModal()});
const AIC=['General AI','Research','Writing','Learning','Coding','Design','Prompt management'],PS=['Idea','In progress','Prototype','Published'];
const C={
tasks:{n:'task',p:'tasks',k:'title',fc:'pri',fo:['Open','Done','High','Medium','Low'],f:[['title','Title','text',0,1],['desc','Description','area'],['cat','Category','sel',['Work','Personal','Learning','Health']],['pri','Priority','sel',['Low','Medium','High']],['due','Due date','date']]},
goals:{n:'goal',p:'goals',k:'title',fo:['Open','Done'],f:[['title','Goal','text',0,1],['desc','Description','area'],['target','Target date','date'],['miles','Milestones (one per line)','area'],['progress','Recorded progress (0 to 100%)','rng',100]]},
tools:{n:'tool',p:'tools',k:'name',fc:'cat',fo:AIC,f:[['name','Name','text',0,1],['desc','Description','area'],['cat','Category','sel',AIC],['url','Website address (https://…)','url',0,1],['notes','Notes','area']]},
prompts:{n:'prompt',p:'prompts',k:'title',fc:'cat',fo:AIC,f:[['title','Title','text',0,1],['text','Prompt text','area',0,1],['cat','Category','sel',AIC],['tags','Tags (comma separated)','text']]},
projects:{n:'project',p:'projects',k:'name',fc:'status',fo:PS,f:[['name','Name','text',0,1],['desc','Description','area'],['cat','Category','sel',['Web','Mobile','Data','Tool','Other']],['status','Status','sel',PS],['tech','Technologies used','text'],['live','Live demo address','url'],['repo','Repository address','url'],['problem','Problem','area'],['sol','Solution','area'],['impl','Implementation','area'],['feat','Features','area'],['less','Lessons learned','area'],['fut','Future improvements','area']]},
skills:{n:'skill',p:'skills',k:'name',fc:'status',fo:['Not started','Learning','Practicing','Comfortable'],f:[['name','Skill','text',0,1],['cat','Category','text'],['status','Learning status','sel',['Not started','Learning','Practicing','Comfortable']],['level','Self-assessed level (0 to 5)','rng',5],['proj','Linked projects','text'],['notes','Notes','area']]},
games:{n:'game',p:'games',k:'name',fc:'status',fo:['Backlog','Playing','Completed','Wishlist','Dropped'],f:[['name','Game title','text',0,1],['platform','Platform','sel',['PC','PlayStation','Xbox','Switch','Mobile','Other']],['genre','Genre','text'],['status','Status','sel',['Backlog','Playing','Completed','Wishlist','Dropped']],['level','Your rating (0 to 5)','rng',5],['hours','Hours played','number'],['notes','Notes','area']]},
notes:{n:'entry',p:'entries',k:'title',fc:'cat',fo:['Note','Idea','Research','Bookmark','Documentation','Lesson'],f:[['title','Title','text',0,1],['content','Content','area',0,1],['cat','Category','sel',['Note','Idea','Research','Bookmark','Documentation','Lesson']],['tags','Tags (comma separated)','text']]}};
const Q={},F={},host=u=>{try{return new URL(u).host}catch{return u}};
const bar=p=>`<div class=bar role=progressbar aria-valuemin=0 aria-valuemax=100 aria-valuenow=${p} aria-label=Progress><i style="width:${p}%"></i></div>`;
const SB={tasks:i=>[i.cat,i.pri+' priority',i.due&&'Due '+i.due],goals:i=>[i.done?'Completed':'In progress'],tools:i=>[i.cat,host(i.url)],prompts:i=>[i.cat,i.tags],projects:i=>[i.status,i.cat,'Updated '+dk(i.updated)],skills:i=>[i.cat,i.status,i.proj&&'Linked: '+i.proj],notes:i=>[i.cat,i.tags,dk(i.updated)],games:i=>[i.platform,i.genre,i.status]};
const X={tasks:i=>i.desc?`<p>${E(i.desc)}</p>`:'',
goals:i=>`<p>${E(i.desc)}</p>${i.miles?'<ul class=ml>'+i.miles.split('\n').filter(Boolean).map(m=>'<li>'+E(m)+'</li>').join('')+'</ul>':''}${bar(+i.progress||0)}<small>${+i.progress||0}% recorded${i.target?'. Target '+i.target:''}</small>`,
tools:i=>`<p>${E(i.desc)}</p>${i.notes?'<p class=mu>'+E(i.notes)+'</p>':''}`,
prompts:i=>`<p class=pv>${E(i.text.slice(0,160))}${i.text.length>160?'…':''}</p>`,
projects:i=>`<p>${E(i.desc)}</p><small>${E(i.tech)}</small>`,
skills:i=>`${bar((+i.level||0)*20)}<small>Self-rated ${+i.level||0} of 5. Not a measured result.</small>${i.notes?'<p class=mu>'+E(i.notes)+'</p>':''}`,
notes:i=>`<p>${E(i.content.slice(0,160))}${i.content.length>160?'…':''}</p>`,games:i=>`<p class=stars aria-label="Rating ${+i.level||0} of 5">${'★'.repeat(+i.level||0)}${'☆'.repeat(5-(+i.level||0))}</p><small>${+i.hours||0} h played</small>${i.notes?'<p class=mu>'+E(i.notes)+'</p>':''}`};
const A={tools:i=>`<a class="bt pr" href="${E(i.url)}" target=_blank rel="noopener noreferrer">Open site</a>`,prompts:i=>`<button data-a=copy data-c=prompts data-id=${i.id}>Copy</button>`,
projects:i=>`<button data-a=view data-c=projects data-id=${i.id}>Details</button>`+(i.live?`<a class=bt href="${E(i.live)}" target=_blank rel="noopener noreferrer">Live demo</a>`:'')+(i.repo?`<a class=bt href="${E(i.repo)}" target=_blank rel="noopener noreferrer">Repository</a>`:''),
skills:i=>`<button data-a=learn data-c=skills data-id=${i.id}>Log practice</button>`,games:i=>`<button data-a=hr data-c=games data-id=${i.id}>+1 hour</button>`};
const row=(c,i)=>`<article class="it${i.done?' dn':''}"><div class=hd>${c=='projects'||c=='games'?`<div class=th aria-hidden=true>${E(i.name[0]||'?')}</div>`:''}${c=='tasks'||c=='goals'?`<input type=checkbox data-a=tog data-c=${c} data-id=${i.id} ${i.done?'checked':''} aria-label="Mark done: ${E(i[C[c].k])}">`:''}<h3>${E(i[C[c].k])}</h3>${i.demo?'<span class=tg>Demo</span>':''}</div><p class=mu>${E(SB[c](i).filter(Boolean).join(' · '))}</p>${X[c](i)}<div class=ac>${A[c]?A[c](i):''}<button data-a=edit data-c=${c} data-id=${i.id}>Edit</button><button data-a=del data-c=${c} data-id=${i.id}>Delete</button></div></article>`;
function list(c){const q=(Q[c]||'').toLowerCase(),fl=F[c]&&F[c]!='All'?F[c]:'',cf=C[c];
const a=S[c].filter(i=>(!q||JSON.stringify(Object.values(i)).toLowerCase().includes(q))&&(!fl||(fl=='Open'?!i.done:fl=='Done'?i.done:i[cf.fc]==fl)));
a.sort(c=='tasks'?(x,y)=>(x.done|0)-(y.done|0)||((x.due||'9')>(y.due||'9')?1:-1):(x,y)=>y.updated-x.updated);
return a.length?a.map(i=>row(c,i)).join(''):`<p class=em>${S[c].length?'Nothing matches your search or filter.':'No '+cf.p+' yet. Use Add to create one.'}</p>`}
const tb=c=>`<div class=tb><input type=search data-q=${c} placeholder="Search ${C[c].p}" aria-label="Search ${C[c].p}" value="${E(Q[c]||'')}"><select data-fl=${c} aria-label="Filter ${C[c].p}">${['All',...C[c].fo].map(o=>`<option ${(F[c]||'All')==o?'selected':''}>${o}</option>`).join('')}</select><button class=pr data-a=add data-c=${c}>Add ${C[c].n}</button></div><div id=l-${c}>${list(c)}</div>`;
const sec=(t,h,x='')=>`<section class=cd><div class=sh><h2>${t}</h2>${x}</section>`.replace('</section>','</div>'+h+'</section>');
const ml=(a,f)=>a.length?'<ul class=ml>'+a.map(i=>'<li>'+f(i)+'</li>').join('')+'</ul>':'<p class=em>Nothing here yet.</p>';
